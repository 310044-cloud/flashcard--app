<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>離線單字閃卡 PWA</title>
  
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --primary-color: #4f46e5;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); margin: 0; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
    .header { width: 100%; max-width: 400px; text-align: center; margin-bottom: 10px; }
    .header h1 { font-size: 1.25rem; color: var(--text-main); margin: 0; }
    .pwa-btn { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; margin-top: 6px; cursor: pointer; display: none; }
    .flashcard-container { perspective: 1000px; width: 100%; max-width: 360px; height: 260px; margin: 10px 0; cursor: pointer; }
    .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    .flashcard.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; background: var(--card-bg); padding: 20px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 1px solid rgba(0,0,0,0.05); }
    .card-back { transform: rotateY(180deg); background: #fdfbf7; }
    .card-tag { font-size: 0.75rem; font-weight: 700; color: var(--primary-color); background: #e0e7ff; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; }
    .card-text { font-size: 1.35rem; font-weight: 700; color: var(--text-main); text-align: center; word-break: break-word; overflow-y: auto; max-height: 160px; display: flex; align-items: center; justify-content: center; }
    .card-hint { font-size: 0.75rem; color: var(--text-sub); }
    .controls { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 8px; }
    .review-btns, .action-btns { display: flex; gap: 8px; width: 100%; }
    button { flex: 1; padding: 10px; border: none; border-radius: 12px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: background 0.2s; }
    .btn-again { background: #fee2e2; color: #dc2626; }
    .btn-good { background: #d1fae5; color: #059669; }
    .btn-action { background: #e0e7ff; color: var(--primary-color); }
    .btn-primary { background: var(--primary-color); color: white; }
    #file-input { display: none; }
    .status { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; text-align: center; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📚 離線單字閃卡</h1>
    <button id="pwa-install-btn" class="pwa-btn">📲 安裝此 App 到手機主畫面</button>
  </div>

  <div class="flashcard-container" onclick="toggleCardFlip()">
    <div class="flashcard" id="card">
      <div class="card-face card-front">
        <span class="card-tag">ENGLISH</span>
        <div class="card-text" id="front-text">點擊下方按鈕新增單字</div>
        <span class="card-hint">點擊卡片翻面</span>
      </div>
      <div class="card-face card-back">
        <span class="card-tag" style="color:#059669; background:#d1fae5;">中文翻譯</span>
        <div class="card-text" id="back-text">（背面內容）</div>
        <span class="card-hint">點擊卡片翻面</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="review-btns">
      <button class="btn-again" onclick="handleReview(false)">❌ 忘記了 (重來)</button>
      <button class="btn-good" onclick="handleReview(true)">⭕ 記住了 (下一張)</button>
    </div>
    <div class="action-btns">
      <button class="btn-action" onclick="document.getElementById('file-input').click()">📷 拍照/OCR 辨識</button>
      <button class="btn-primary" onclick="addCardManual()">+ 手動新增單字</button>
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment" onchange="processImageOCR(this)">
    <div class="status" id="status-text">載入中...</div>
  </div>

  <script>
    let cards = JSON.parse(localStorage.getItem('cards_data') || '[]');
    let currentIndex = 0;
    let isFlipped = false;

    function saveCards() {
      localStorage.setItem('cards_data', JSON.stringify(cards));
      renderUI();
    }

    function renderUI() {
      const frontText = document.getElementById('front-text');
      const backText = document.getElementById('back-text');
      const statusText = document.getElementById('status-text');

      if (cards.length === 0) {
        frontText.innerText = "目前沒有卡片，請新增！";
        backText.innerText = "目前沒有卡片";
        statusText.innerText = "卡片總數：0";
        return;
      }

      if (currentIndex >= cards.length) currentIndex = 0;
      const current = cards[currentIndex];

      frontText.innerText = current.front;
      backText.innerText = current.back || "（無翻譯）";
      statusText.innerText = `卡片：${currentIndex + 1} / ${cards.length}`;
    }

    function toggleCardFlip() {
      if (cards.length === 0) return;
      const cardEl = document.getElementById('card');
      isFlipped = !isFlipped;
      cardEl.classList.toggle('flipped', isFlipped);
    }

    function resetFlip() {
      isFlipped = false;
      document.getElementById('card').classList.remove('flipped');
    }

    function handleReview(remembered) {
      if (cards.length === 0) return;
      resetFlip();
      setTimeout(() => {
        if (remembered) {
          currentIndex = (currentIndex + 1) % cards.length;
        } else {
          // 答錯時，隨機移到後面重新出現
          let card = cards.splice(currentIndex, 1)[0];
          cards.push(card);
          saveCards();
        }
        renderUI();
      }, 200);
    }

    function addCardManual() {
      const front = prompt("請輸入英文單字/句子：");
      if (!front) return;
      const back = prompt("請輸入中文翻譯：");
      cards.push({ front: front.trim(), back: back ? back.trim() : "" });
      currentIndex = cards.length - 1;
      resetFlip();
      saveCards();
    }

    // 升級版 OCR 處理：支援繁中+英文，並自動按行拆分卡片
    async function processImageOCR(input) {
      if (!input.files || !input.files[0]) return;
      const statusText = document.getElementById('status-text');
      statusText.innerText = '⏳ 正在讀取繁中與英文文字模型中...';

      try {
        // 同時下載/使用 英文(eng) + 繁體中文(chi_tra) 模型
        const worker = await Tesseract.createWorker(['eng', 'chi_tra']);
        statusText.innerText = '⏳ 離線辨識單字中，請稍候...';

        const ret = await worker.recognize(input.files[0]);
        await worker.terminate();

        const rawText = ret.data.text.trim();
        if (!rawText) {
          alert("未能辨識出文字，請重新拍照！");
          renderUI();
          return;
        }

        // 按行分割文字
        const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let addedCount = 0;

        lines.forEach(line => {
          // 若包含斜線 '/' 或 括號，自動嘗試切割英文與中文
          if (line.includes('/')) {
            let parts = line.split('/');
            parts.forEach(part => parseAndAddCard(part));
          } else {
            parseAndAddCard(line);
          }
        });

        alert(`辨識完成！已自動將圖中文字拆分成獨立閃卡！`);
        currentIndex = cards.length - 1;
        resetFlip();
        saveCards();

      } catch (err) {
        alert("OCR 辨識失敗：" + err.message);
        renderUI();
      }
    }

    // 將單行字串解析出「英文」與「中文」並存入卡片
    function parseAndAddCard(str) {
      if (!str || str.length < 2) return;
      
      // 自動嘗試拆分 英文 (包含括號或直接相連的中文)
      // 例如 publish (出版) -> 正面: publish, 背面: (出版)
      let match = str.match(/^([a-zA-Z\s\-\.\,\;]+)(.*)$/);
      if (match && match[1].trim().length > 0) {
        let front = match[1].trim();
        let back = match[2].trim() || "（未辨識出中文）";
        cards.push({ front: front, back: back });
      } else {
        cards.push({ front: str, back: "（拍照辨識卡片）" });
      }
    }

    // PWA 安裝支援
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('pwa-install-btn');
      btn.style.display = 'inline-block';
      btn.addEventListener('click', () => {
        deferredPrompt.prompt();
      });
    });

    renderUI();
  </script>
</body>
</html>
